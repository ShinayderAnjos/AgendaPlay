<!doctype html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head th:replace="~{fragmentos :: head('Não foi possível continuar')}"></head>
  <body>
    <header th:replace="~{fragmentos :: header}"></header>
    <main class="pagina estreita">
      <section class="painel">
        <p class="etiqueta">VAMOS CONFERIR</p>
        <h1 class="titulo">Não foi possível continuar</h1>
        <p
          th:text="${mensagem != null ? mensagem : (status == 404 ? 'Esta página não foi encontrada.' : (status == 403 ? 'Acesso não permitido ou sessão expirada. Entre novamente e tente outra vez.' : 'Ocorreu um problema ao processar sua solicitação. Tente novamente.'))}"
        ></p>
        <div class="acoes">
          <a class="botao" th:href="@{/painel}">Voltar ao início</a
          ><a th:href="@{/login}">Entrar novamente</a>
        </div>
      </section>
    </main>
    <footer th:replace="~{fragmentos :: footer}"></footer>
  </body>
</html>
