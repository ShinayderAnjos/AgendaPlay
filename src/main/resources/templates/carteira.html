<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Carteira')}"></head><body>
<header th:replace="~{fragmentos :: header}"></header><main class="pagina">
<p class="etiqueta">DEMONSTRAÇÃO ACADÊMICA</p><h1 class="titulo">Carteira virtual</h1>
<p>Recargas e pagamentos são simulados para fins acadêmicos. Nenhum dinheiro real é movimentado.</p>
<div th:replace="~{fragmentos :: avisos}"></div>
<section class="painel"><h2>Saldo disponível</h2><strong th:text="'R$ ' + ${#numbers.formatDecimal(saldo,1,'POINT',2,'COMMA')}"></strong></section>
<section class="painel"><h2>Recarga simulada</h2><form method="post" th:action="@{/cliente/carteira/recarregar}">
<input type="hidden" name="chave" th:value="${chave}" />
<label for="valor">Valor em reais</label><input id="valor" name="valor" type="number" min="0.01" max="9999999999.99" step="0.01" required />
<button class="botao" type="submit">Simular recarga</button></form></section>
<section><h2>Histórico</h2><div th:if="${#lists.isEmpty(movimentos)}" class="vazio">Nenhuma movimentação.</div>
<div class="painel" th:each="m : ${movimentos}">
<strong th:text="${m.tipo}"></strong> · <span th:text="'R$ ' + ${#numbers.formatDecimal(m.valor,1,'POINT',2,'COMMA')}"></span>
<span th:if="${m.idReserva != null}" th:text="' · Reserva #' + ${m.idReserva}"></span>
<small th:text="${#temporals.format(m.criadoEm,'dd/MM/yyyy HH:mm')}"></small>
</div></section></main><footer th:replace="~{fragmentos :: footer}"></footer></body></html>
