<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Validar código')}"></head>
<body>
<header th:replace="~{fragmentos :: header}"></header>
<main class="pagina">
  <h1 class="titulo">Validar código</h1>
  <div th:replace="~{fragmentos :: avisos}"></div>
  <section class="painel recuperacao">
    <p>Digite o código de seis dígitos enviado ao e-mail da sua conta. Ele vale por 10 minutos e permite até cinco tentativas.</p>
    <form th:action="@{/validar-codigo}" method="post">
      <label for="email">E-mail da conta</label><input id="email" name="email" type="email" th:value="${email}" autocomplete="email" maxlength="160" required />
      <label for="codigo">Código de verificação</label><input id="codigo" name="codigo" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autocomplete="one-time-code" required />
      <button class="botao" type="submit">Validar código</button>
    </form>
    <p><a th:href="@{/recuperar-senha}">Solicitar novo código</a></p>
    <p><a th:href="@{/login}">Voltar para entrar</a></p>
  </section>
</main>
<footer th:replace="~{fragmentos :: footer}"></footer>
</body></html>
