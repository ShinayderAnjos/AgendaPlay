<!doctype html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head th:replace="~{fragmentos :: head('Dados do estabelecimento')}"></head>
  <body>
    <header th:replace="~{fragmentos :: header}"></header>
    <main class="pagina">
      <h1 class="titulo">Dados do estabelecimento</h1>
      <div th:replace="~{fragmentos :: avisos}"></div>
      <section class="painel estreita">
        <form
          th:action="${id==null ? '/proprietario/estabelecimentos/novo' : '/proprietario/estabelecimentos/'+id+'/editar'}"
          th:object="${form}"
          method="post"
        >
          <div th:replace="~{fragmentos :: erros}"></div>
          <label for="nome">Nome do estabelecimento</label
          ><input id="nome" th:field="*{nome}" maxlength="120" required /><label
            for="localizacao"
            >Endereço</label
          ><input
            id="localizacao"
            th:field="*{localizacao}"
            maxlength="240"
            required
          />
          <div th:replace="~{mapa :: seletor}"></div>
          <button class="botao" type="submit">Salvar estabelecimento</button>
          <a th:href="@{/proprietario/estabelecimentos}">Voltar</a>
        </form>
      </section>
    </main>
    <footer th:replace="~{fragmentos :: footer}"></footer>
  </body>
</html>
