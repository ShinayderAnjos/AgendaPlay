<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head('Início')}"></head>
  <body>
    <header th:replace="~{fragmentos :: header}"></header>
    <main class="pagina">
      <h1>Agendamento de quadras</h1>
      <p>
        Consulte as quadras disponíveis, cadastre horários e acompanhe suas
        reservas.
      </p>
      <p><a th:href="@{/painel}">Consultar quadras</a></p>
      <h2>Cadastro</h2>
      <ul>
        <li>
          <a th:href="@{/cadastro/cliente}">Cadastrar cliente</a> para reservar
          horários.
        </li>
        <li>
          <a th:href="@{/cadastro/proprietario}">Cadastrar proprietário</a> para
          gerenciar quadras e disponibilidades.
        </li>
      </ul>
      <p>Já possui uma conta? <a th:href="@{/login}">Entrar</a></p>
    </main>
    <footer th:replace="~{fragmentos :: footer}"></footer>
  </body>
</html>
