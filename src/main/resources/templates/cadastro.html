<!doctype html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head th:replace="~{fragmentos :: head('Criar conta')}"></head>
  <body>
    <header th:replace="~{fragmentos :: header}"></header>
    <main class="pagina estreita">
      <section class="painel">
        <p class="etiqueta" th:text="${perfil}"></p>
        <h1>Criar sua conta</h1>
        <p class="texto-menor">
          Telefone é opcional. Clientes informam CPF; proprietários, CPF ou
          CNPJ.
        </p>
        <form
          th:action="@{/cadastro/{tipo}(tipo=${tipo})}"
          th:object="${form}"
          method="post"
        >
          <div th:replace="~{fragmentos :: erros}"></div>
          <label for="nome">Nome completo</label
          ><input
            id="nome"
            th:field="*{nome}"
            autocomplete="name"
            required
            minlength="3"
            maxlength="120"
          />
          <label for="email">E-mail</label
          ><input
            id="email"
            th:field="*{email}"
            type="email"
            autocomplete="email"
            required
            maxlength="160"
          />
          <div class="dupla">
            <div>
              <label
                for="cpf"
                th:text="${tipo=='cliente' ? 'CPF' : 'CPF ou CNPJ'}"
              ></label
              ><input
                id="cpf"
                th:field="*{cpf}"
                th:placeholder="${tipo=='cliente' ? '000.000.000-00' : 'CPF ou CNPJ, inclusive com letras'}"
                th:attr="inputmode=${tipo=='cliente' ? 'numeric' : 'text'}"
                maxlength="18"
                required
              />
            </div>
            <div>
              <label for="telefone">Telefone <small>(opcional)</small></label
              ><input
                id="telefone"
                th:field="*{telefone}"
                type="tel"
                autocomplete="tel"
                maxlength="20"
              />
            </div>
          </div>
          <label for="senha">Senha</label
          ><input
            id="senha"
            name="senha"
            type="password"
            minlength="8"
            maxlength="60"
            autocomplete="new-password"
            required
          /><small
            >Use de 8 a 60 caracteres, com maiúscula, minúscula, número e
            símbolo.</small
          >
          <p id="forca-senha" class="texto-menor" aria-live="polite"></p>
          <label for="confirmacaoSenha">Confirme a senha</label
          ><input
            id="confirmacaoSenha"
            name="confirmacaoSenha"
            type="password"
            autocomplete="new-password"
            required
          />
          <button type="submit" class="botao">Criar conta</button>
        </form>
        <p class="texto-menor">
          Já tem conta? <a th:href="@{/login}">Entrar</a>
        </p>
        <p>
          <a
            th:href="${tipo=='cliente' ? '/cadastro/proprietario' : '/cadastro/cliente'}"
            th:text="${tipo=='cliente' ? 'Cadastrar como proprietário' : 'Cadastrar como cliente'}"
          ></a>
        </p>
      </section>
    </main>
    <footer th:replace="~{fragmentos :: footer}"></footer>
  </body>
</html>
