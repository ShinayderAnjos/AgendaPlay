<!doctype html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head th:replace="~{fragmentos :: head('Dados da quadra')}"></head>
  <body>
    <header th:replace="~{fragmentos :: header}"></header>
    <main class="pagina estreita">
      <a th:href="@{/proprietario/quadras}">← Minhas quadras</a>
      <h1
        class="titulo"
        th:text="${id==null ? 'Cadastrar quadra' : 'Editar quadra'}"
      ></h1>
      <p>
        Preencha as informações que os clientes verão ao procurar um espaço.
      </p>
      <section class="painel">
        <form
          th:action="${id==null ? '/proprietario/quadras/nova' : '/proprietario/quadras/'+id+'/editar'}"
          th:object="${form}"
          method="post"
        >
          <div th:replace="~{fragmentos :: erros}"></div>
          <label for="nome">Nome da quadra</label
          ><input
            id="nome"
            th:field="*{nome}"
            required
            maxlength="120"
            placeholder="Ex.: Arena Central"
          />
          <label for="modalidade">Modalidade</label
          ><input
            id="modalidade"
            th:field="*{modalidade}"
            required
            maxlength="60"
            placeholder="Ex.: Futsal, vôlei, beach tennis"
          />
          <label for="localizacao">Localização</label
          ><input
            id="localizacao"
            th:field="*{localizacao}"
            required
            maxlength="240"
            placeholder="Rua, número, bairro e cidade"
          />
          <div class="dupla">
            <div>
              <label for="valorHora">Valor por hora (R$)</label
              ><input
                id="valorHora"
                th:field="*{valorHora}"
                type="number"
                min="0"
                max="99999999.99"
                step="0.01"
                required
              />
            </div>
            <div>
              <label for="situacao">Situação</label
              ><select id="situacao" th:field="*{situacao}">
                <option value="ATIVA">Ativa</option>
                <option value="INATIVA">Inativa</option>
              </select>
            </div>
          </div>
          <p class="texto-menor">
            Quadras inativas deixam de aceitar novas reservas. O histórico e as
            reservas já confirmadas são mantidos.
          </p>
          <div class="acoes">
            <button class="botao" type="submit">Salvar quadra</button
            ><a th:href="@{/proprietario/quadras}">Voltar</a>
          </div>
        </form>
      </section>
    </main>
    <footer th:replace="~{fragmentos :: footer}"></footer>
  </body>
</html>
