<!doctype html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head th:replace="~{fragmentos :: head('Quadras')}"></head>
  <body>
    <header th:replace="~{fragmentos :: header}"></header>
    <main class="pagina">
      <div class="titulo-linha">
        <div>
          <p
            class="etiqueta"
            th:text="${dono ? 'ÁREA DO PROPRIETÁRIO' : 'ÁREA DO CLIENTE'}"
          ></p>
          <h1
            class="titulo"
            th:text="${dono ? 'Minhas quadras' : 'Quadras disponíveis'}"
          ></h1>
          <p
            th:text="${dono ? 'Cadastre quadras e gerencie os horários disponíveis.' : 'Escolha a modalidade, confira os detalhes e consulte a agenda.'}"
          ></p>
        </div>
        <a th:if="${dono}" class="botao" th:href="@{/proprietario/quadras/nova}"
          >Cadastrar quadra</a
        >
      </div>
      <div th:replace="~{fragmentos :: avisos}"></div>
      <form
        th:if="${!dono}"
        class="filtros painel"
        method="get"
        th:action="@{/cliente/quadras}"
      >
        <div>
          <label for="modalidade">Modalidade</label
          ><input id="modalidade" name="modalidade" th:value="${modalidade}" />
        </div>
        <div>
          <label for="localizacao">Localização</label
          ><input
            id="localizacao"
            name="localizacao"
            th:value="${localizacao}"
          />
        </div>
        <div>
          <label for="estabelecimento">Estabelecimento</label
          ><select id="estabelecimento" name="estabelecimento">
            <option value="">Todos</option>
            <option
              th:each="e : ${estabelecimentos}"
              th:value="${e.id}"
              th:text="${e.nome}"
              th:selected="${filtroEstabelecimento==e.id}"
            ></option>
          </select>
        </div>
        <div>
          <label for="valorMaximo">Preço máximo por hora (R$)</label
          ><input
            id="valorMaximo"
            name="valorMaximo"
            type="number"
            min="0"
            step="0.01"
            th:value="${valorMaximo}"
          />
        </div>
        <div>
          <label for="data">Data</label
          ><input id="data" name="data" type="date" th:value="${data}" />
        </div>
        <div>
          <label for="inicio">Início</label
          ><input id="inicio" name="inicio" type="time" th:value="${inicio}" />
        </div>
        <div>
          <label for="fim">Fim</label
          ><input id="fim" name="fim" type="time" th:value="${fim}" />
        </div>
        <label class="check"
          ><input
            type="checkbox"
            name="disponiveis"
            value="true"
            th:checked="${disponiveis}"
          />Somente com horários livres</label
        ><button class="botao" type="submit">Filtrar</button
        ><a th:href="@{/cliente/quadras}">Limpar</a
        ><a th:href="@{/cliente/estabelecimentos}">Ver por estabelecimento</a>
      </form>
      <div th:if="${#lists.isEmpty(quadras)}" class="vazio">
        <h2
          th:text="${dono ? 'Nenhuma quadra cadastrada' : 'Ainda não há quadras disponíveis'}"
        ></h2>
        <p
          th:text="${dono ? 'Cadastre um espaço e depois adicione os horários disponíveis.' : 'Os proprietários ainda estão preparando a agenda. Volte em breve.'}"
        ></p>
      </div>
      <div class="lista-quadras">
        <article class="quadra" th:each="q : ${quadras}">
          <div class="quadra-dados">
            <span class="situacao" th:text="${q.situacao}"></span>
            <h2 th:text="${q.nome}"></h2>
<<<<<<< HEAD
            <p>Modalidade: <span th:text="${q.modalidade}"></span></p>
=======
            <p th:text="${nomesEstabelecimentos[q.idEstabelecimento]}"></p>
>>>>>>> 3814952 (feat: implementa funcionalidades da Sprint 3)
            <p th:text="${q.localizacao}"></p>
            <p class="preco">
              R$
              <strong
                th:text="${#numbers.formatDecimal(q.valorHora,1,'POINT',2,'COMMA')}"
              ></strong
              ><small> / hora base · consulte os valores dos horários</small>
            </p>
            <div class="acoes">
              <a
                th:if="${!dono}"
                class="botao"
                th:href="@{/cliente/quadras/{id}/horarios(id=${q.id})}"
                >Ver horários</a
              ><a
                th:if="${dono}"
                class="botao"
                th:href="@{/proprietario/quadras/{id}/agenda(id=${q.id})}"
                >Disponibilidades</a
              ><a
                th:if="${dono}"
                th:href="@{/proprietario/quadras/{id}/editar(id=${q.id})}"
                >Editar</a
              >
            </div>
          </div>
        </article>
      </div>
    </main>
    <footer th:replace="~{fragmentos :: footer}"></footer>
  </body>
</html>
