<!doctype html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head th:replace="~{fragmentos :: head('Quadras')}"></head>
  <body>
    <header th:replace="~{fragmentos :: header}"></header>
    <main class="pagina">
      <div class="titulo-linha">
        <div>
          <p
            class="etiqueta"
            th:text="${dono ? 'ÁREA DO PROPRIETÁRIO' : 'ÁREA DO CLIENTE'}"
          ></p>
          <h1
            class="titulo"
            th:text="${dono ? 'Minhas quadras' : 'Quadras disponíveis'}"
          ></h1>
          <p
            th:text="${dono ? 'Cadastre quadras e gerencie os horários disponíveis.' : 'Escolha a modalidade, confira os detalhes e consulte a agenda.'}"
          ></p>
        </div>
        <a th:if="${dono}" class="botao" th:href="@{/proprietario/quadras/nova}"
          >Cadastrar quadra</a
        >
      </div>
      <div th:replace="~{fragmentos :: avisos}"></div>
      <div th:if="${#lists.isEmpty(quadras)}" class="vazio">
        <h2
          th:text="${dono ? 'Nenhuma quadra cadastrada' : 'Ainda não há quadras disponíveis'}"
        ></h2>
        <p
          th:text="${dono ? 'Cadastre um espaço e depois adicione os horários disponíveis.' : 'Os proprietários ainda estão preparando a agenda. Volte em breve.'}"
        ></p>
      </div>
      <div class="lista-quadras">
        <article class="quadra" th:each="q : ${quadras}">
          <div class="quadra-dados">
            <span class="situacao" th:text="${q.situacao}"></span>
            <h2 th:text="${q.nome}"></h2>
            <p>Modalidade: <span th:text="${q.modalidade}"></span></p>
            <p th:text="${q.localizacao}"></p>
            <p class="preco">
              R$
              <strong
                th:text="${#numbers.formatDecimal(q.valorHora,1,'POINT',2,'COMMA')}"
              ></strong
              ><small> / hora</small>
            </p>
            <div class="acoes">
              <a
                th:if="${!dono}"
                class="botao"
                th:href="@{/cliente/quadras/{id}/horarios(id=${q.id})}"
                >Ver horários</a
              ><a
                th:if="${dono}"
                class="botao"
                th:href="@{/proprietario/quadras/{id}/agenda(id=${q.id})}"
                >Disponibilidades</a
              ><a
                th:if="${dono}"
                th:href="@{/proprietario/quadras/{id}/editar(id=${q.id})}"
                >Editar</a
              >
            </div>
          </div>
        </article>
      </div>
    </main>
    <footer th:replace="~{fragmentos :: footer}"></footer>
  </body>
</html>
