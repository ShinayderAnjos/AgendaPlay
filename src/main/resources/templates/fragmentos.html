<!doctype html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head th:fragment="head(titulo)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title th:text="${titulo} + ' | AgendaPlay'">AgendaPlay</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <link rel="stylesheet" th:href="@{/vendor/leaflet/leaflet.css}" />
    <link rel="stylesheet" th:href="@{/css/sprint3.css}" />
    <script defer th:src="@{/vendor/leaflet/leaflet.js}"></script>
    <script defer th:src="@{/js/app.js}"></script>
    <script defer th:src="@{/js/sprint3.js}"></script>
  </head>
  <body>
    <header th:fragment="header" class="cabecalho">
      <a class="marca" th:href="@{/}">AgendaPlay</a>
      <nav aria-label="Menu principal">
        <a
          sec:authorize="hasRole('PROPRIETARIO')"
          th:href="@{/proprietario/estabelecimentos}"
          >Estabelecimentos</a
        >
        <a
          sec:authorize="hasRole('PROPRIETARIO')"
          th:href="@{/proprietario/agenda}"
          >Agenda</a
        >
        <a
          sec:authorize="hasRole('CLIENTE')"
          th:href="@{/cliente/estabelecimentos}"
          >Estabelecimentos</a
        >
        <a sec:authorize="isAuthenticated()" th:href="@{/painel}">Quadras</a
        ><a sec:authorize="isAuthenticated()" th:href="@{/reservas}">Reservas</a
        ><a sec:authorize="isAuthenticated()" th:href="@{/conta}"
          >Minha conta</a
        >
        <a sec:authorize="isAnonymous()" th:href="@{/login}">Entrar</a
        ><a
          sec:authorize="isAnonymous()"
          class="botao"
          th:href="@{/cadastro/cliente}"
          >Criar conta</a
        >
        <form
          sec:authorize="isAuthenticated()"
          th:action="@{/sair}"
          method="post"
        >
          <button class="botao" type="submit">Sair</button>
        </form>
      </nav>
    </header>
    <div th:fragment="avisos">
      <section
        th:if="${notificacoes != null and !#lists.isEmpty(notificacoes)}"
        class="aviso"
        aria-label="Cancelamentos"
        role="status"
      >
        <h2>Cancelamentos recentes</h2>
        <article th:each="n : ${notificacoes}">
          <p th:text="${n.mensagem}"></p>
          <form th:action="@{/notificacoes/{id}/ler(id=${n.id})}" method="post">
            <button class="botao secundario pequeno" type="submit">
              Marcar como lida
            </button>
          </form>
        </article>
      </section>
      <div
        th:if="${sucesso}"
        class="aviso sucesso"
        role="status"
        th:text="${sucesso}"
      ></div>
      <div
        th:if="${erro}"
        class="aviso erro"
        role="alert"
        th:text="${erro}"
      ></div>
    </div>
    <div
      th:fragment="erros"
      class="aviso erro"
      role="alert"
      th:if="${#fields.hasAnyErrors()}"
    >
      <p>Confira os dados para continuar:</p>
      <ul>
        <li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li>
      </ul>
    </div>
    <footer th:fragment="footer">AgendaPlay · Protótipo acadêmico</footer>
  </body>
</html>
