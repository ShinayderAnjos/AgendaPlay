spring.application.name=AgendaPlay
spring.config.import=optional:file:./config/application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/AgendaPlay}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-init-sql=SET search_path TO agendaplay, public
spring.flyway.default-schema=agendaplay
spring.flyway.schemas=agendaplay
spring.thymeleaf.cache=false
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
agendaplay.cancelamento-antecedencia-minutos=${CANCELAMENTO_ANTECEDENCIA_MINUTOS:0}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=41MB
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
agendaplay.url-publica=${APP_URL:http://localhost:8080}
agendaplay.email-remetente=${EMAIL_REMETENTE:nao-responda@agendaplay.local}
